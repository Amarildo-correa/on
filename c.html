<!doctype html>
<!--
  Controle remoto do Read on TV (versão /on) no celular. Mesma estratégia do Read on TV clássico (repositório tv).
  A TV mostra um código (e um QR que abre esta página com ?c=CÓDIGO&b=BROKER).
  Cada toque publica um comando num broker MQTT público; a TV confirma (ack) para medir a ida e volta.
-->
<html lang="pt-BR">
<title>Read on TV · Controle</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#202124">
<style>
  /* tokens: mesmos nomes e valores do app da TV (index.html) quando existem lá */
  :root {
    /* superfícies */
    --bg: #202124; --card: #141414; --control: #454545; --input: #1C1C1C; --input-line: #333333;
    /* texto e ícones */
    --white: #FFFFFF; --sub: #B3B3B3; --dim: #9A9A9A; --key-label: #D0D0D0; --key-icon: #C8C8C8;
    /* marca e foco */
    --brand: #357DED; --brand-press: #102547; --brand-glow: rgba(53, 125, 237, .28); --focus: #FFD60A;
    /* estados da conexão */
    --ok: #7BE495; --bad: #FF8A80; --warn: #FFD54F;
    /* botões redondos (relevo) e sombras */
    --key-top: #2E2E2E; --key-bottom: #111111; --key-edge: #3A3A3A; --shadow: rgba(0, 0, 0, .5); --shadow-ring: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--white); font-family: Roboto, system-ui, sans-serif; }
  [hidden] { display: none !important; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; gap: 16px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { margin: 0; font-size: 20px; color: var(--brand); }
  .st { font-size: 15px; font-weight: 700; text-align: right; }
  .meta { font-size: 14px; color: var(--sub); margin: 0; }
  button { -webkit-appearance: none; appearance: none; border: 0; border-radius: 18px; background: var(--control); color: var(--white); font: inherit; font-size: 34px; font-weight: 700; touch-action: manipulation; }
  button:active, button.down { background: var(--brand); color: var(--card); }
  /* Controle para uma mão (destro): anel direcional no canto inferior direito, Voltar à esquerda dele embaixo */
  .remote { position: relative; width: 262px; height: 250px; margin: auto 0 0 auto;
    margin-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .ring { position: absolute; top: 0; right: 0; width: 210px; height: 210px; display: block; overflow: visible;
    filter: drop-shadow(0 6px 14px var(--shadow-ring)); }
  .ring .seg { fill: transparent; cursor: pointer; }
  .ring .seg.down { fill: var(--brand-glow); }
  .ring .chev { fill: none; stroke: var(--dim); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .ring .seg.down + .chev { stroke: var(--brand); }
  .ring .okc { fill: url(#gOk); stroke: var(--card); stroke-width: 1.5; cursor: pointer; }
  .ring .okc.down { fill: var(--brand-press); }
  .ring .oklbl { fill: var(--key-label); font: 700 15px system-ui, sans-serif; letter-spacing: .06em; pointer-events: none; }
  /* Botões redondos à esquerda do anel: Voltar embaixo; página acima/abaixo rolam a matéria aberta na TV */
  .back-btn, .pg-btn { position: absolute; left: 4px; width: 56px; height: 56px; padding: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, var(--key-top), var(--key-bottom) 70%); box-shadow: inset 0 1px 0 var(--key-edge), 0 4px 10px var(--shadow);
    display: flex; align-items: center; justify-content: center; color: var(--key-icon); }
  .back-btn svg, .pg-btn svg { width: 26px; height: 26px; pointer-events: none; }
  .back-btn.down, .back-btn:active, .pg-btn.down, .pg-btn:active { background: var(--brand-press); color: var(--brand); }
  .back-btn { bottom: 0; }
  .pg-btn.up { top: 0; } .pg-btn.dn { top: 68px; }
  .join { display: flex; flex-direction: column; gap: 12px; margin: auto 0; }
  .join input { font: inherit; font-size: 32px; letter-spacing: .2em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 12px; border: 2px solid var(--input-line); background: var(--input); color: var(--white); -webkit-user-select: text; user-select: text; }
  .join button { height: 64px; font-size: 22px; background: var(--focus); color: var(--card); }
  a { color: var(--brand); font-size: 14px; }
</style>

<!-- Entrar com o código -->
<main id="join" hidden>
  <header><h1>Controle Read on TV</h1></header>
  <form class="join" id="joinForm">
    <p class="meta">Na TV, abra o Read on TV, vá ao menu lateral e escolha Controle. Digite o código que aparecer:</p>
    <input id="joinCode" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
    <button type="submit">Conectar</button>
  </form>
</main>

<!-- D-pad -->
<main id="ph" hidden>
  <header>
    <h1>Controle <span id="phCode"></span></h1>
    <div class="st warn" id="phStatus">Conectando…</div>
  </header>
  <p class="meta" id="phMeta">Toque em qualquer botão para testar.</p>
  <a href="c" id="change">Trocar de TV</a>
  <div class="remote">
    <svg class="ring" viewBox="0 0 210 210" role="group" aria-label="Direcional">
      <defs>
        <radialGradient id="gRing" cx="50%" cy="42%" r="60%">
          <stop offset="0" stop-color="#262626"/><stop offset=".75" stop-color="#121212"/><stop offset="1" stop-color="#060606"/>
        </radialGradient>
        <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/>
        </linearGradient>
        <radialGradient id="gOk" cx="50%" cy="38%" r="65%">
          <stop offset="0" stop-color="#2C2C2C"/><stop offset="1" stop-color="#161616"/>
        </radialGradient>
      </defs>
      <!-- Corpo do anel com bisel, como a referência -->
      <circle cx="105" cy="105" r="103" fill="url(#gRing)" stroke="#3A3A3A" stroke-width="1.5"/>
      <circle cx="105" cy="105" r="96" fill="none" stroke="url(#gSheen)" stroke-width="10"/>
      <circle cx="105" cy="105" r="89" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="1"/>
      <circle cx="105" cy="105" r="47" fill="#050505" stroke="#2E2E2E" stroke-width="1"/>
      <!-- Setores em arco: cada um é a área de toque de uma direção -->
      <path class="seg" data-k="up" role="button" aria-label="Cima" d="M32.17 32.17A103 103 0 0 1 177.83 32.17L137.53 72.47A46 46 0 0 0 72.47 72.47Z"/>
      <path class="chev" d="M110.4 33.5L105 24.5L99.6 33.5"/>
      <path class="seg" data-k="right" role="button" aria-label="Direita" d="M177.83 32.17A103 103 0 0 1 177.83 177.83L137.53 137.53A46 46 0 0 0 137.53 72.47Z"/>
      <path class="chev" d="M176.5 110.4L185.5 105L176.5 99.6"/>
      <path class="seg" data-k="down" role="button" aria-label="Baixo" d="M177.83 177.83A103 103 0 0 1 32.17 177.83L72.47 137.53A46 46 0 0 0 137.53 137.53Z"/>
      <path class="chev" d="M99.6 176.5L105 185.5L110.4 176.5"/>
      <path class="seg" data-k="left" role="button" aria-label="Esquerda" d="M32.17 177.83A103 103 0 0 1 32.17 32.17L72.47 72.47A46 46 0 0 0 72.47 137.53Z"/>
      <path class="chev" d="M33.5 99.6L24.5 105L33.5 110.4"/>
      <circle class="okc" data-k="ok" role="button" aria-label="OK" cx="105" cy="105" r="41"/>
      <text class="oklbl" x="105" y="110.5" text-anchor="middle">OK</text>
    </svg>
    <button class="pg-btn up" data-k="pgup" type="button" aria-label="Página acima">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="chevrons-up"></svg>
    </button>
    <button class="pg-btn dn" data-k="pgdn" type="button" aria-label="Página abaixo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="chevrons-down"></svg>
    </button>
    <button class="back-btn" data-k="back" type="button" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-ico="undo-2"></svg>
    </button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.min.js"></script>
<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"></script>
<script>
(function () {
  ROTV.drawIcons();

  var BROKERS = ROTV.BROKERS;
  var KEY_LAST_CODE = 'readontv-on:remote-last', KEY_BROKER = 'readontv-on:remote-b';
  var SWITCH_MS = 12000;   /* sem conexão por 12 s (ex.: porta bloqueada pela rede do celular): troca de broker */
  var ACK_WARN_MS = 3000;  /* sem confirmação em 3 s: o código pode ter sido trocado na TV (ou a TV está desligada) */
  var REPEAT_KEYS = ['up', 'down', 'left', 'right', 'pgup', 'pgdn'];

  function $(id) { return document.getElementById(id); }
  var storage = {
    get: function (k) { try { return localStorage.getItem(k); } catch (err) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (err) {} },
    remove: function (k) { try { localStorage.removeItem(k); } catch (err) {} }
  };
  function cleanCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); }

  var params = new URLSearchParams(location.search);
  var code = cleanCode(params.get('c'));
  if (code.length === 5) startPad();
  else startJoin();

  function startJoin() {
    $('join').hidden = false;
    var last = cleanCode(storage.get(KEY_LAST_CODE));
    if (last.length === 5) $('joinCode').value = last;
    $('joinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var c = cleanCode($('joinCode').value);
      if (c.length === 5) location.href = location.pathname + '?c=' + c + '&b=' + (storage.get(KEY_BROKER) || 0);
    });
    $('joinCode').focus();
  }

  function startPad() {
    $('ph').hidden = false;
    $('phCode').textContent = code;
    if (typeof mqtt === 'undefined') { setStatus('Falha ao carregar', 'bad'); return; }
    /* o índice no link (&b=) só diz por qual broker começar */
    var bi = Math.min(BROKERS.length - 1, Math.max(0, parseInt(params.get('b'), 10) || 0));
    storage.set(KEY_LAST_CODE, code);
    storage.set(KEY_BROKER, bi);

    var seq = 0, sentAt = {}, lastRtt = null, acked = false, acks = 0, rtts = [];
    var client = null, downSince = 0, revoked = false;

    function connect() {
      if (client) { try { client.end(true); } catch (err) {} }
      downSince = Date.now();
      setStatus('Conectando…', 'warn');
      var c = client = mqtt.connect(BROKERS[bi], ROTV.mqttOptions('ph'));
      c.on('connect', function () {
        if (c !== client) return;
        downSince = 0;
        storage.set(KEY_BROKER, bi);
        c.subscribe(ROTV.TOPIC_PREFIX + code + '/ack', { qos: 0 });
        setStatus(acked ? 'TV conectada' : 'Pronto · toque para testar', acked ? 'ok' : 'warn');
      });
      c.on('close', function () { if (c === client && !downSince) downSince = Date.now(); });
      c.on('reconnect', function () { if (c === client) setStatus('Reconectando…', 'warn'); });
      c.on('offline', function () { if (c === client) setStatus('Sem conexão', 'bad'); });
      c.on('error', function () { if (c === client && BROKERS.length > 1) setStatus('Servidor lento, tentando outro…', 'warn'); });
      c.on('message', onAck);
    }
    /* broker atual sem resposta: passa para o próximo (o que conectar fica lembrado) */
    setInterval(function () {
      if (!revoked && downSince && Date.now() - downSince > SWITCH_MS && navigator.onLine !== false) {
        bi = (bi + 1) % BROKERS.length;
        connect();
      }
    }, 2000);

    function onAck(topic, payload) {
      var m; try { m = JSON.parse(String(payload)); } catch (err) { return; }
      if (m && m.revoked) { revoke(); return; }
      if (!m || !sentAt[m.n]) return;
      lastRtt = Math.round(performance.now() - sentAt[m.n]);
      delete sentAt[m.n];
      acks++; rtts.push(lastRtt); if (rtts.length > 50) rtts.shift();
      acked = true; setStatus('TV conectada', 'ok'); /* também limpa um aviso de "não respondeu" anterior */
      updateMeta();
    }
    /* A TV gerou um código novo: este celular deixa de controlar e volta para a tela de código */
    function revoke() {
      revoked = true;
      try { client.end(true); } catch (err) {}
      storage.remove(KEY_LAST_CODE);
      setStatus('TV desconectou este celular', 'bad');
      $('phMeta').textContent = 'Toque em "Trocar de TV" e digite o novo código que aparece na TV.';
    }
    function updateMeta() {
      var avg = rtts.length ? Math.round(rtts.reduce(function (x, y) { return x + y; }, 0) / rtts.length) : '—';
      $('phMeta').textContent = 'Resposta da TV: ' + (lastRtt === null ? '—' : lastRtt + ' ms') + ' · média ' + avg + ' ms · ' + acks + '/' + seq + ' confirmados';
    }
    function send(k) {
      if (revoked || !client || !client.connected) return;
      var n = ++seq, now = performance.now();
      sentAt[n] = now;
      setTimeout(function () { if (sentAt[n] && !revoked) setStatus('A TV não respondeu. Confira o código na TV.', 'bad'); }, ACK_WARN_MS);
      client.publish(ROTV.TOPIC_PREFIX + code + '/cmd', JSON.stringify({ k: k, n: n }), { qos: 0 });
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      for (var old in sentAt) if (now - sentAt[old] > 5000) delete sentAt[old];
      updateMeta();
    }

    connect();
    bindButtons(send);
  }

  /* Toque dispara na hora (pointerdown); setas repetem enquanto o dedo fica pressionado */
  function bindButtons(send) {
    var holdTimer = null, repeatTimer = null;
    function stop(btn) { clearTimeout(holdTimer); clearInterval(repeatTimer); holdTimer = repeatTimer = null; if (btn) btn.classList.remove('down'); }
    Array.prototype.forEach.call(document.querySelectorAll('#ph [data-k]'), function (btn) {
      var k = btn.getAttribute('data-k');
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        stop();
        btn.classList.add('down');
        send(k);
        if (REPEAT_KEYS.indexOf(k) !== -1) {
          holdTimer = setTimeout(function () { repeatTimer = setInterval(function () { send(k); }, 160); }, 450);
        }
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { btn.addEventListener(t, function () { stop(btn); }); });
      btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });
  }

  function setStatus(text, cls) { var el = $('phStatus'); el.textContent = text; el.className = 'st ' + cls; }
})();
</script>
</html>
