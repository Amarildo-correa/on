<!doctype html>
<!--
  /v: lê tudo o que o navegador expõe sobre si mesmo, o sistema e o aparelho, mostra em JSON
  e envia por e-mail. Página de diagnóstico de uso pessoal: sem regras de segurança.
  ES5 de propósito (com recursos novos só quando existem): roda nos navegadores antigos de TV.
-->

<title>Read on TV · Diagnóstico</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A2D35">
<style>

  html, body { margin: 0; background: var(--bg); color: var(--white); font-family: Roboto, system-ui, sans-serif; }
  main { padding: 16px; box-sizing: border-box; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  button { border: 0; border-radius: 10px; background: var(--brand); color: var(--white); font: inherit; font-size: 18px; font-weight: 700; padding: 12px 20px; cursor: pointer; }
  button.alt { background: var(--control); }
  button:focus { outline: 4px solid var(--focus); outline-offset: 2px; }
  button[disabled] { opacity: .5; cursor: default; }
  #st { font-size: 15px; color: var(--sub); }
  #st.ok { color: var(--ok); } #st.bad { color: var(--bad); }
  pre { margin: 0; padding: 12px; background: var(--card); border-radius: 10px; font: 13px/1.45 "Roboto Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
</style>
<main>
  <div class="bar">
    <button id="send" disabled>Enviar por e-mail</button>
    <button id="copy" class="alt" disabled>Copiar JSON</button>
    <button id="speak" class="alt" disabled>Testar fala</button>
    <button id="heard" class="alt" hidden>Ouvi a voz</button>
    <button id="notHeard" class="alt" hidden>Não ouvi</button>
    <span id="st">Lendo informações do navegador…</span>
  </div>
  <pre id="out"></pre>
</main>

        boundary: f.boundary.total + ' ' + JSON.stringify(f.boundary.tipos), duracaoMs: f.duracaoMs, palpite: f.palpiteSom, ouviu: f.ouvidoPeloUsuario } : f,
      vozes: Array.isArray(R.vozes) ? R.vozes.length : R.vozes, apis: R.apis && R.apis.resumo,
      fuso: R.intl && R.intl.timeZone, ip: R.ipPublico, coletadoEm: R.coletadoEm
    };
    var t = JSON.stringify(r, null, 1);
    while (new Blob([t]).size > 3800 && t.length > 100) t = t.slice(0, -200);
    return t + '';
  }
  /* Plano B, para navegadores em que o fetch falha (ex.: Silk): formulário enviado num iframe escondido.
     Não depende de CORS nem de ler a resposta. enctype text/plain gera o corpo "nome=valor": o nome leva o JSON
     até a abertura de um campo extra e o valor o fecha, então o Apps Script recebe um JSON válido, igual ao do fetch. */
  function enviarPorFormulario(payload, pronto) {
    var nome = 'v' + Date.now(), ifr = document.createElement('iframe'), f = document.createElement('form'), inp = document.createElement('input');
    var txt = JSON.stringify(payload);
    ifr.name = nome; ifr.style.display = 'none';
    f.method = 'POST'; f.action = GAS_URL; f.target = nome; f.enctype = 'text/plain'; f.acceptCharset = 'UTF-8'; f.style.display = 'none';
    inp.type = 'hidden'; inp.name = txt.slice(0, -1) + ',"_":"'; inp.value = '"}';
    f.appendChild(inp);
    var feito = false;
    function fim(ok) { if (feito) return; feito = true; pronto(ok); setTimeout(function () { f.remove(); ifr.remove(); }, 60000); }
    /* o iframe carrega quando o Google responde: o pedido chegou e o script rodou */
    ifr.onload = function () { if (ifr.getAttribute('data-sent')) fim(true); };
    setTimeout(function () { fim(false); }, 30000);
    document.body.appendChild(ifr); document.body.appendChild(f);
    ifr.setAttribute('data-sent', '1');
    f.submit();
  }

  btnSend.onclick = function () {
    if (!GAS_URL) { status('Envio não configurado: falta a URL do Apps Script (GAS_URL em v.html).', 'bad'); return; }
    btnSend.disabled = true;
    status('Enviando para ' + EMAIL + '…');
    var payload = { subject: title(), resumo: resumo(), json: json };
    var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    /* text/plain: requisição simples, sem preflight de CORS (o Apps Script não responde a OPTIONS) */
    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var j; try { j = JSON.parse(txt); } catch (e) { throw new Error('resposta não é JSON: ' + txt.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 120)); }
        if (!j || !j.ok) throw new Error(j && j.error || 'resposta inesperada');
        clearTimeout(t);
        if (R.problemaEnvio && typeof R.problemaEnvio === 'object') { R.problemaEnvio.ultimoEnvio = { metodo: 'fetch', ok: true }; render(); }
        status('Enviado para ' + EMAIL + '.', 'ok');
        btnSend.disabled = false;
      })
      .catch(function (e) {
        clearTimeout(t);
        var motivo = (e && (e.name + ': ' + e.message)) || String(e);
        if (R.problemaEnvio && typeof R.problemaEnvio === 'object') R.problemaEnvio.ultimoEnvio = { metodo: 'formulario (modo compatível)', falhaFetch: motivo };
        render();
        payload.subject += ' (modo compatível)';
        payload.resumo = 'O fetch falhou neste navegador: ' + motivo + '\n\n' + resumo();
        payload.json = json;
        status('fetch falhou (' + motivo + '). Tentando modo compatível…');
        enviarPorFormulario(payload, function (ok) {
          if (R.problemaEnvio && typeof R.problemaEnvio === 'object' && R.problemaEnvio.ultimoEnvio) { R.problemaEnvio.ultimoEnvio.ok = ok ? 'resposta recebida no iframe' : false; render(); }
          status(ok ? 'Enviado para ' + EMAIL + ' (modo compatível).' : 'Falha no envio: o Google não respondeu em 30 s. Use Copiar JSON.', ok ? 'ok' : 'bad');
          btnSend.disabled = false;
        });
      });
  };

  btnCopy.onclick = function () {
    function fallback() { var t = document.createElement('textarea'); t.value = json; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); status('JSON copiado.', 'ok'); } catch (e) { status('Não foi possível copiar.', 'bad'); } t.remove(); }
    if (n.clipboard && n.clipboard.writeText) n.clipboard.writeText(json).then(function () { status('JSON copiado.', 'ok'); }, fallback); else fallback();
  };
})();
</script>
