<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read on TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Roboto:wght@400;500;600;700;900&family=Roboto+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.min.js"></script>
<style>
/* Palco 1920x1080 escalado; margem de segurança 96/54; cabeçalho em uma linha; foco fixo, trilhos se movem */
/* ícones Lucide (CDN): traço na cor do texto; tamanhos e espessuras específicos vêm das regras abaixo */
svg[data-ico]{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root{--letterbox:#0E0E0E;--bg:#2A2A2A;--card:#141414;--thumb:#1F1F1F;--rule:#3A3A3A;--title:#E0E0E0;--sub:#B3B3B3;--focus:#FFD60A;--brand:#4FB8FF;
--font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;--safe-x:96px;--safe-y:54px;--rail-x:180px;--gap:32px;--ring:5px;--move:.6s cubic-bezier(.33,0,.2,1);--tint:.14s ease;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--letterbox);overflow:hidden}
.viewport{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:var(--letterbox)}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--title);font-family:var(--font);transform-origin:center}
/* ===== Cabeçalho: barra (busca, menu, ações) + faixa de informações ===== */
/* ===== Layout do palco: três blocos =====
   nav.side (coluna do menu, 0 → --rail-x) | header.top e main.main (coluna do conteúdo, a partir de --rail-x).
   Cabeçalho e trilhos começam no mesmo x, alinhados com o 1º card. */
.top{position:absolute;top:0;left:var(--rail-x);right:0;height:244px;background:var(--bg);z-index:6}
/* fundo do cabeçalho cobre também a folga de 24px do main (trilhos subindo não aparecem ali durante a animação) */
.top::before{content:"";position:absolute;top:0;bottom:0;right:100%;width:24px;background:var(--bg)}
.top button{flex:none;border:0;margin:0;outline:none;cursor:pointer;font-family:var(--font);transition:background-color .12s,color .12s}
.top svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.hd-bar{position:absolute;top:0;left:0;right:0;height:118px;box-sizing:border-box;padding:0 var(--safe-x) 0 0;border-bottom:3px solid #444;display:flex;align-items:center}
.hd-search{align-self:flex-end;margin-bottom:-3px!important;width:431px;height:85px;box-sizing:border-box;display:flex;align-items:center;padding:0 28px;background:#474747;border-bottom:4px solid #9A9A9A!important;color:#fff;font-size:33px;font-weight:500;text-align:left;white-space:nowrap}
.hd-search svg{width:34px;height:34px;stroke-width:2.6;margin-right:20px}
.hd-nav{display:flex;align-items:center;margin-left:64px}
.hd-nav>*+*{margin-left:26px}
.hd-link{height:64px;padding:0 20px;display:flex;align-items:center;background:transparent;color:#fff;font-size:34px;font-weight:500;white-space:nowrap}
.hd-link[aria-current="page"]{color:var(--brand)}
.hd-ico{width:64px;height:64px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;color:#fff}
.hd-ico svg{width:44px;height:44px;stroke-width:2}
.hd-nav .hd-ico svg{width:48px;height:48px;stroke-width:2.2}
.hd-nav{margin-top:18px}
.top button.on,.top .hd-link.on[aria-current="page"]{background:var(--focus);color:var(--card)}
/* item da seção atual continua distinguível quando focado */
.top .hd-link.on[aria-current="page"]{box-shadow:inset 0 -6px 0 var(--card)}
.top [hidden]{display:none!important}
.hd-search[hidden]+.hd-nav{margin-left:0}
.hd-search.on{border-bottom-color:var(--card)!important}
.hd-info{position:absolute;top:118px;left:0;right:0;height:126px;box-sizing:border-box;padding:8px var(--safe-x) 0 0;display:flex;align-items:center;white-space:nowrap}
.hd-logo{flex:none;display:flex;align-items:center;font-family:"Raleway",var(--font);font-size:40px;font-weight:800;line-height:1;color:#fff}
.hd-logo b{font-weight:800;color:var(--brand);margin-left:.26em}
.hd-logo svg{width:36px;height:36px;margin-left:4px;color:var(--brand);fill:currentColor;stroke:none;transition:color .2s}
.hd-logo svg.off{color:#6A6A6A}
.hd-sep{flex:none;width:3px;height:56px;background:#4A4A4A;margin:0 32px}
.hd-info h1{flex:0 1 auto;min-width:0;margin:0;font-size:48px;font-weight:500;line-height:1.2;color:#fff;overflow:hidden;text-overflow:ellipsis}
.hd-meta{flex:none;margin-left:auto;padding-left:32px;display:flex;align-items:center;font-size:38px;font-weight:500;line-height:1}
.hd-date{color:#CFCFCF;font-variant-numeric:tabular-nums}
.hd-city{color:#fff}
.hd-wx{display:flex;align-items:center;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.hd-wx svg{width:46px;height:46px;stroke-width:1.9;color:#fff;margin-right:10px}
/* foco da previsão do tempo: faixa amarela sobre o título (h1) e a data, do separador do logo até a margem direita */
.hd-meta{cursor:pointer}
.top .hd-wxbar{position:absolute;top:20px;right:74px;left:var(--wb-left,480px);height:92px;box-sizing:border-box;padding:0 36px 0 36px;display:flex;align-items:center;justify-content:flex-end;
background:var(--focus);color:var(--card);font-weight:700;white-space:nowrap;overflow:hidden;visibility:hidden;z-index:1}
.top .hd-wxbar.on{visibility:visible}
.wb-txt{min-width:0;font-size:40px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.top .hd-wxbar .wb-go{width:36px;height:36px;stroke-width:3;margin:0 22px 0 24px}
.wb-city{flex:none;font-size:38px;line-height:1}
.wb-sep{flex:none;width:4px;height:56px;margin:0 24px;background:currentColor}
.wb-wx{flex:none;display:flex;align-items:center;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.top .hd-wxbar .wb-wx svg{width:48px;height:48px;stroke-width:2.4;margin-right:10px}
/* ===== Barra lateral (menu) =====
   recolhida: só ícones, na margem de segurança à esquerda; aberta: ícones + rótulos, cobre a faixa de informações e empurra os trilhos */
.side{position:absolute;top:0;left:0;bottom:0;width:var(--rail-x);box-sizing:border-box;z-index:7;background:transparent;font-family:var(--font);pointer-events:none;transition:width var(--move),background-color .2s}
.side button{pointer-events:auto}
.side.open{pointer-events:auto}
/* aberto: termina em x=616, onde começam os trilhos empurrados; a borda direita é a linha divisória entre o menu e a coluna do cabeçalho/cards */
.side.open{width:616px;background:var(--bg);border-right:2px solid #444}
.side button{border:0;margin:0;outline:none;cursor:pointer;font-family:var(--font);background:transparent}
.side svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* logo do menu aberto: maior, em caixa alta e mais apagado (opacidade .8) */
.side-logo{position:absolute;left:90px;top:104px;display:flex;align-items:center;font-family:"Raleway",var(--font);font-size:66px;font-weight:800;line-height:1;text-transform:uppercase;color:#fff;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .2s}
.side-logo b{font-weight:800;color:var(--brand);margin-left:.26em}
.side-logo svg{width:1em;height:1em;margin-left:0;color:var(--brand);fill:currentColor;stroke:none}
.side.open .side-logo{opacity:.8;visibility:visible}
.side-list{position:absolute;left:72px;right:0;top:252px;display:flex;flex-direction:column;gap:18px}
.side.open .side-list{right:104px}
.side-btn{display:flex;align-items:center;width:100%;height:66px;box-sizing:border-box;padding:0 20px 0 12px;color:#fff;transition:background-color .12s,color .12s}
.side-ic{flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.side-ic svg{width:44px;height:44px}
.side-tx{margin-left:26px;font-size:36px;font-weight:500;white-space:nowrap;overflow:hidden;max-width:0;opacity:0;transition:max-width var(--move),opacity .18s}
.side.open .side-tx{max-width:460px;opacity:1}
.side-btn.on{background:var(--focus);color:var(--card)}
.side-account{position:absolute;left:72px;right:0;bottom:var(--safe-y)}
.side.open .side-account{right:104px}
.side-search{visibility:hidden}
.side.open .side-search{visibility:visible}
/* ícone em azul: celular pareado (aria-pressed) e seção atual (Início), quando não focados */
.side [aria-pressed="true"]:not(.on) .side-ic,.side [aria-current="page"]:not(.on) .side-ic{color:var(--brand)}
/* estado aberto: esconde logo/sep/título e o campo de busca do cabeçalho; escurece os links */
.stage.side-open .hd-search{visibility:hidden}
.stage.side-open .hd-info .hd-logo,.stage.side-open .hd-info .hd-sep,.stage.side-open #railTitle{visibility:hidden}
.stage.side-open .hd-nav .hd-link,.stage.side-open .hd-nav .hd-ico{color:#5E5E5E}
.stage.side-open .hd-nav .hd-link[aria-current="page"]{color:#5E5E5E}
/* main: começa 24px antes de --rail-x (folga para o anel de foco). O que desliza para a esquerda continua visível atrás do menu
   (peek); o recorte só esconde a faixa do cabeçalho (y < 244), para trilhos que sobem não aparecerem no canto superior esquerdo */
.main{position:absolute;top:0;bottom:0;left:calc(var(--rail-x) - 24px);right:0;clip-path:polygon(-4000px 244px,100% 244px,100% 100%,-4000px 100%)}
.rails{position:absolute;left:0;top:0;width:100%;z-index:1;transition:transform var(--move)}
.rail{position:absolute;left:0;width:100%}
.track{position:absolute;top:0;left:24px;display:flex;transition:transform var(--move)}
.track>.card+.card{margin-left:var(--gap)}
.card{flex:none;width:var(--w);height:var(--h);background:var(--card);display:flex;flex-direction:column;position:relative;cursor:pointer;outline:none;transition:background-color var(--tint),opacity var(--move)}
/* anel do foco é parte do card: aparece no card novo em vez de deslizar até ele */
.card::before{content:"";position:absolute;top:calc(var(--ring) * -1);right:calc(var(--ring) * -1);bottom:calc(var(--ring) * -1);left:calc(var(--ring) * -1);border:var(--ring) solid var(--focus);z-index:2;pointer-events:none;opacity:0;transition:opacity .12s}
.card.on::before{opacity:1}
.card .t,.card .cat,.card .s,.card .meta,.card .c-mark svg{transition:color var(--tint),border-color var(--tint),background-color var(--tint)}
/* card focado mantém o tamanho e não tem sombra: só ganha o anel e a superfície amarela */
.thumb{position:relative;flex:none;height:calc(var(--w) * 9 / 16);background:var(--thumb);overflow:hidden}
.big .thumb{height:var(--th)}
/* enquadramento puxado para cima: em foto de notícia o rosto costuma estar no terço superior */
.thumb img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
/* sem foto: ícone Lucide que representa a editoria, centralizado sobre o fundo da miniatura */
.ph-ico{position:absolute;left:50%;top:50%;width:136px;height:136px;transform:translate(-50%,-50%);color:#464646;stroke-width:1.8;display:none;pointer-events:none}
.big .ph-ico{width:160px;height:160px;margin-top:-40px}
.p-hero .ph-ico{width:190px;height:190px;margin-top:-30px}
.thumb.noimg .ph-ico,.p-hero.noimg .ph-ico{display:block}
/* ===== Cards da Home =====
   todos os trilhos: foto no topo, título em placa escura sobre a base da foto, fio claro e linha "EDITORIA ... relógio há 1h"
   lido (.seen): título mais escuro e olho no canto da foto; focado (.on): superfície amarela, textos escuros */
.body{flex:1;min-width:0;box-sizing:border-box;display:flex;flex-direction:column}
.big .body{padding:33px 48px 34px 40px}
.t{margin:0;font-size:41px;font-weight:700;line-height:48px;color:#EEE;overflow-wrap:anywhere}
/* card grande: o corte em 2 linhas é feito em JS (fitTitles) para o "…" ficar dentro da placa escura/amarela; max-height é só a rede de segurança */
.big .t{position:absolute;left:29px;right:52px;bottom:calc(100% - var(--th) - 10px);z-index:2;max-height:99px;overflow:hidden;padding-top:3px}
.big .t .hl{background:var(--card);padding:3px 25px 3px 12px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-color var(--tint)}
.cat{flex:none;font-size:35px;font-weight:700;line-height:35px;text-transform:uppercase;color:#B8B8B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{min-width:0}
.meta{flex:none;display:flex;align-items:center;min-width:0;border-top:4px solid #EEE;white-space:nowrap}
.big .meta{height:57px;padding-top:12px}
.meta .s{margin-left:auto;padding-left:24px}
.s{flex:none;display:flex;align-items:center;font-size:35px;font-weight:700;line-height:1;color:#B8B8B8}
.s svg,.c-mark svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.s svg{width:34px;height:34px;stroke-width:2.4;margin:0 15px 0 -2px}
/* matéria lida: olho no canto superior direito da foto, sobre uma máscara escura radial que o destaca */
.c-mark{position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;display:none;
background:radial-gradient(circle at 100% 0,rgba(0,0,0,.87) 0,rgba(0,0,0,.7) 120px,rgba(0,0,0,.45) 240px,rgba(0,0,0,.22) 300px,rgba(0,0,0,0) 345px)}
.c-mark svg{position:absolute;width:80px;height:80px;stroke-width:2.2;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.big .c-mark svg{top:35px;right:68px}
.card.seen .c-mark{display:block}
.card.on .c-mark svg{color:var(--focus)}
.card.seen .t{color:#ADADAD}
.card.big.seen .meta{border-top-color:#ADADAD}
/* card focado: superfície amarela com textos escuros */
.card.on{background:var(--focus)}
.card.on .t,.card.on.seen .t{color:#000}
.card.big.on .t .hl{background:var(--focus)}
.card.on .cat,.card.on .s{color:var(--card)}
.card.on .meta,.card.big.seen.on .meta{border-top-color:var(--card)}
/* peek atrás do menu: cards à esquerda do card atual de cada trilho ficam apagados (só eles, não o menu) */
.card.peek{opacity:.35}
/* gradiente (máscara) no peek: a parte visível do card (últimos 148px, de x=0 até --rail-x − gap) começa inteira na borda da tela
   e some de forma linear até 53px antes do fim (x≈95), para não ficar card atrás dos ícones do menu */
.card.peek{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 148px),transparent calc(100% - 53px));mask-image:linear-gradient(to right,#000 calc(100% - 148px),transparent calc(100% - 53px))}
.card.on .thumb::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;border:7px solid var(--focus);pointer-events:none}
.card.big.on .thumb::after{border-bottom:0}
/* esqueleto de carregamento */
.card.sk{cursor:default}
.sk .thumb{animation:pulse 1.4s ease-in-out infinite}
.skl{display:block;height:26px;background:var(--thumb);animation:pulse 1.4s ease-in-out infinite}
.skl.c{width:30%;height:22px}.skl.a{width:92%;height:40px}.skl.b{width:64%;height:40px}.skl.d{width:26%;height:24px;margin-top:auto}
@keyframes pulse{50%{opacity:.55}}
.toast{position:absolute;left:50%;bottom:var(--safe-y);transform:translateX(-50%);z-index:8;background:var(--card);border:2px solid var(--rule);padding:18px 32px;font-size:26px;color:var(--title);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ===== Tela da matéria (tela cheia; barra de ações fixa no rodapé) ===== */
.post{position:absolute;top:0;right:0;bottom:0;left:0;z-index:7;background:var(--card);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.post.show{opacity:1;visibility:visible;transition:opacity .2s}
.p-side{position:absolute;left:0;top:0;bottom:0;width:694px;overflow:hidden;background:linear-gradient(to bottom,#2A2A2A 0,#2A2A2A 870px,#141414 1100px)}
.p-hero{position:absolute;left:0;top:0;width:694px;height:470px;background:var(--thumb);overflow:hidden}
.p-hero img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.p-scrim{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:1;pointer-events:none;background:linear-gradient(to top,#2A2A2A 0,#2A2A2A 14px,rgba(42,42,42,0) 100%)}
.p-brand{position:absolute;left:var(--safe-x);top:443px;z-index:3;display:flex;align-items:center;font-family:"Raleway",var(--font);font-size:37px;font-weight:800;line-height:1;color:#fff;white-space:nowrap}
.p-brand b{font-weight:800;color:var(--brand);margin-left:.26em}
.p-brand svg{width:36px;height:36px;color:var(--brand);margin-left:4px}
.p-hero.noimg .p-scrim{display:none}
.p-divider{position:absolute;left:var(--safe-x);right:42px;top:498px;height:5px;background:#fff;z-index:2}
.p-info{position:absolute;left:var(--safe-x);right:42px;top:539px}
.p-head{margin:0;padding:4px 0;font-size:50px;line-height:59px;font-weight:700;color:#fff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.p-head .hl{background:#141414;padding:3px 18px 3px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.p-head .pc{font-size:inherit;font-weight:900;color:var(--brand);text-transform:uppercase}
.p-head .pc::after{content:"";display:inline-block;width:5px;height:58px;margin:0 15px 0 19px;background:var(--brand);vertical-align:-11px}
.p-meta{margin:32px 0 0}
.p-ago,.p-src{display:block;font-size:32px;font-weight:700;line-height:43px;color:#C2C2C2}
.p-by{display:block;margin-top:4px;font-size:26px;line-height:36px;color:#ADADAD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-nav{position:absolute;left:var(--safe-x);right:49px;top:923px;height:103px;display:flex;align-items:center;gap:25px}
.p-btn{flex:none;height:87px;display:flex;align-items:center;justify-content:center;gap:14px;padding:0;border:0;background:#454545;color:#fff;font:900 38px/1 var(--font);cursor:pointer;outline:none;transition:background-color .12s,color .12s}
.p-btn.back,.p-btn.next{width:87px}
.p-btn svg{width:44px;height:44px;flex:none;stroke-width:1.9}
.p-btn.listen{margin-left:auto;width:244px;height:103px;gap:16px;text-transform:uppercase}
.p-btn.listen svg{width:48px;height:48px;stroke-width:2.3}
.p-btn.on{background:var(--focus);color:var(--card)}
.p-btn[aria-disabled="true"]{opacity:.35}
.p-btn[hidden]{display:none}
.p-read{position:absolute;left:792px;right:0;top:0;bottom:0}
.p-time{position:absolute;top:var(--safe-y);right:var(--safe-x);height:46px;display:flex;align-items:center;gap:64px;font-size:33px;color:#CCC;white-space:nowrap}
.p-time b{font-weight:500;color:var(--brand)}
.p-time svg{width:46px;height:46px;color:var(--brand);flex:none}
.p-rule{position:absolute;left:15px;right:185px;top:112px;height:3px;background:var(--rule)}
.p-scroll{position:absolute;left:0;right:154px;top:132px;bottom:var(--safe-y);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;outline:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 94px),rgba(0,0,0,.33));mask-image:linear-gradient(to bottom,#000 calc(100% - 94px),rgba(0,0,0,.33))}
.p-scroll::-webkit-scrollbar{display:none}
.p-foot{padding-bottom:94px}
.p-track{position:absolute;right:var(--safe-x);top:129px;bottom:var(--safe-y);width:8px;background:#585858}
.p-prog{position:absolute;left:0;right:0;top:0;height:100%;background:var(--brand);transition:top .2s,height .2s}
.p-body{font-size:38px;line-height:64px;font-weight:600;color:#E0E0E0;overflow-wrap:break-word}
.p-body>:first-child{margin-top:0}
/* blocos recebem foco para leitores de tela; sem contorno visual */
.p-body [tabindex],.p-scroll,.p-foot{outline:none}
.p-body p{margin:0 0 35px}
.p-body strong,.p-body b{font-weight:700;color:#fff}
.p-body .lead{margin:0 0 35px}
.p-body .lead::first-letter{float:left;font-weight:900;font-size:138px;line-height:.78;color:var(--brand);margin:20px 16px 0 -2px}
.p-body h2{font-size:44px;line-height:1.3;font-weight:700;margin:56px 0 24px;color:#fff}
.p-body h3,.p-body h4{font-size:40px;line-height:1.3;font-weight:700;margin:48px 0 18px;color:#fff}
.p-body ul,.p-body ol{margin:0 0 35px;padding-left:44px}
.p-body li{margin:0 0 12px}
.p-body blockquote{margin:6px 0 40px;padding:2px 0 2px 32px;border-left:5px solid var(--brand);font-style:italic;font-size:38px;line-height:1.5;color:#E0E0E0}
.p-body blockquote p:last-child{margin-bottom:0}
.p-body figure{margin:10px 0 44px}
.p-body figure img{display:block;width:100%;height:auto;background:var(--thumb)}
.p-body figcaption{margin-top:14px;font-size:24px;line-height:1.4;color:#9A9A9A}
/* ===== Controle pelo celular: ícone azul quando há celular pareado; tela de pareamento com QR e código ===== */
.top .hd-ico[aria-pressed="true"]:not(.on){color:var(--brand)}
.rm{position:absolute;top:0;right:0;bottom:0;left:0;z-index:7;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.rm.show{opacity:1;visibility:visible;transition:opacity .2s}
.rm svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rm-top{position:absolute;left:var(--safe-x);right:var(--safe-x);top:var(--safe-y);height:118px;display:flex;align-items:center;border-bottom:3px solid #444}
.rm-title{margin:0 0 0 48px;font-size:48px;font-weight:500;color:#fff;white-space:nowrap}
.rm-btn{flex:none;height:87px;display:flex;align-items:center;gap:18px;padding:0 34px;border:0;background:#454545;color:#fff;font:900 34px/1 var(--font);cursor:pointer;outline:none;transition:background-color .12s,color .12s}
.rm-btn svg{width:40px;height:40px}
.rm-btn.on{background:var(--focus);color:var(--card)}
.rm-body{position:absolute;left:var(--safe-x);right:var(--safe-x);top:290px;bottom:var(--safe-y);display:flex;align-items:center}
.rm-qr{flex:none;width:520px;height:520px;box-sizing:border-box;padding:32px;background:#fff}
.rm-qr svg{width:100%;height:100%;stroke:none}
.rm-info{margin-left:96px;min-width:0}
.rm-step{margin:0 0 28px;max-width:1000px;font-size:38px;line-height:1.4;color:#E0E0E0}
.rm-step b{color:var(--brand);font-weight:700;overflow-wrap:anywhere}
.rm-code{margin:0 0 44px;font:500 150px/1 "Roboto Mono",ui-monospace,monospace;letter-spacing:.15em;color:#fff;border-left:8px solid var(--focus);padding-left:32px}
.rm-status{display:flex;align-items:center;margin:0;font-size:32px;font-weight:500;color:var(--sub)}
.rm-status svg{width:42px;height:42px;margin-right:16px}
.rm-status.ok{color:var(--brand)}
.rm-new{margin-top:52px}
/* ===== Abertura: despacho de agência — teletipo, faixas de manchetes, carimbo do logo na placa de manchete, voo até o cabeçalho ===== */
.stage.intro-on .top .hd-logo{visibility:hidden}
.intro{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;display:grid;place-items:center;cursor:default;user-select:none;-webkit-user-select:none;font-family:var(--font)}
.intro:not(.run)>:not(.intro-bg):not(.intro-gate){visibility:hidden}
.intro-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg)}
.intro-wire{position:absolute;left:var(--safe-x);right:var(--safe-x);top:150px;height:64px;display:flex;align-items:center;font:500 34px/1 "Roboto Mono",ui-monospace,"SFMono-Regular",monospace;letter-spacing:.04em;color:#CFCFCF;white-space:nowrap;opacity:0}
.intro-wire b{font-weight:500;color:var(--brand)}
.iw-cur{display:inline-block;flex:none;width:.6em;height:1.05em;margin-left:6px;background:var(--focus);animation:icur .9s steps(1) infinite}
@keyframes icur{50%{opacity:0}}
.intro-rule{position:absolute;left:var(--safe-x);right:var(--safe-x);top:226px;height:3px;background:#444;transform-origin:0 50%;transform:scaleX(0)}
.intro-rule::after{content:"";position:absolute;left:0;top:0;bottom:0;width:180px;background:var(--brand)}
.intro-rows{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.ir{position:absolute;left:0;height:60px;margin-top:-30px;display:flex;align-items:center;white-space:nowrap;font-size:34px;font-weight:700;color:#555;opacity:0;will-change:transform}
.ir .c{color:var(--brand);font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-right:18px;opacity:.7}
.ir .q{flex:none;width:14px;height:14px;background:#4A4A4A;margin:0 44px}
.intro-mast{position:relative}
.intro-plate{position:absolute;left:-64px;right:-64px;top:-44px;bottom:-44px;background:var(--card);transform-origin:0 50%;transform:scaleX(0)}
.intro-bar{position:absolute;left:-64px;right:-64px;bottom:-44px;height:5px;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
.intro-logo{position:relative;display:flex;align-items:center;font-family:"Raleway",var(--font);font-size:120px;font-weight:800;line-height:1;color:#fff;white-space:nowrap;transform-origin:50% 50%;opacity:0}
.intro-logo b{font-weight:800;color:var(--brand);margin-left:.26em}
.intro-logo svg{flex:none;width:.9em;height:.9em;margin-left:.1em;fill:var(--brand)}
.intro-tag{position:absolute;left:-64px;top:calc(100% + 80px);font-size:32px;font-weight:500;line-height:1.15;color:var(--sub);border-left:4px solid var(--focus);padding-left:14px;white-space:nowrap;opacity:0}
.intro.rm .intro-rule,.intro.rm .intro-plate,.intro.rm .intro-bar{transform:none}
.intro-gate{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:var(--sub);font-size:36px;font-weight:500}
.intro-gate[hidden]{display:none}
.intro-gate p{margin:0}
.intro-gate kbd{font:inherit;font-weight:900;color:var(--card);background:var(--focus);padding:6px 22px;margin:0 6px}
.intro-gate small{font-size:24px;color:#7A7A7A}
.intro-gate .iw-cur{width:28px;height:44px;margin:0}
@media (prefers-reduced-motion:reduce){.rails,.rail,.card,.card::before,.card .t,.card .cat,.card .s,.track,.toast,.post,.rm,.rm-btn,.p-prog,.p-btn{transition:none}.sk .thumb,.skl,.iw-cur{animation:none}}

<script>
/* ================= Ícones: Lucide via CDN =================
   <svg data-ico="nome"> recebe o desenho do ícone; ico('nome') gera o SVG para conteúdo criado em JS.
   Sem a biblioteca (CDN fora do ar), os ícones ficam vazios e o app segue funcionando. */
const LUCIDE=(window.lucide&&window.lucide.icons)||{};
if(!window.lucide)console.warn('[Read on TV] Lucide indisponível: ícones desligados');
const icoName=n=>String(n).replace(/(^|-)([a-z0-9])/g,(_,a,b)=>b.toUpperCase());
const icoAttr=v=>String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
function icoInner(n){const node=LUCIDE[icoName(n)];
return node?node.map(([tag,at])=>'<'+tag+Object.keys(at).map(k=>' '+k+'="'+icoAttr(at[k])+'"').join('')+'/>').join(''):'';}
function ico(n,cls){return '<svg'+(cls?' class="'+cls+'"':'')+' viewBox="0 0 24 24" aria-hidden="true" data-ico="'+n+'">'+icoInner(n)+'</svg>';}
function setIco(el,n){if(!el)return;el.setAttribute('data-ico',n);el.innerHTML=icoInner(n);}
document.querySelectorAll('svg[data-ico]').forEach(el=>setIco(el,el.getAttribute('data-ico')));

/* ================= Fonte de dados: RSS da Agência Brasil ================= */
const FEED_BASE='https://agenciabrasil.ebc.com.br/rss/';
const EDITORIAS=[['politica','Política'],['economia','Economia'],['geral','Geral'],['internacional','Internacional'],['educacao','Educação'],['saude','Saúde'],['direitos-humanos','Direitos Humanos']];
/* O site não libera CORS para outras origens; tenta direto e depois proxies públicos. O que funcionar fica como preferido. */
/* Proxy próprio (recomendado em produção), ex.: 'https://seu-proxy.exemplo/rss?url='. Vazio = desligado.
   Empacotado como app Tizen (config.xml <access origin="*" subdomains="true"/>) ou webOS, o fetch direto funciona sem proxy. */
const OWN_PROXY='';
const PROXIES=[
u=>u,
...(OWN_PROXY?[u=>OWN_PROXY+encodeURIComponent(u)]:[]),
u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
u=>'https://corsproxy.io/?url='+encodeURIComponent(u),
u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u)];
const REFRESH_MS=15*60*1000,CACHE_KEY='readontv:feeds:v1',PREF_KEY='readontv:proxy',MAX_PER_RAIL=12;
const DC='http://purl.org/dc/elements/1.1/';
/* Redimensiona as fotos do feed (originais de 1–2 MB) para o tamanho exibido: menos memória em TVs de 1–1,5 GB. Vazio = desligado. */
const IMG_RESIZER='https://wsrv.nl/?url=';
/* só redimensiona pela largura (proporção original): o corte fica com o CSS (object-fit + object-position),
   que puxa o enquadramento para cima. O corte do redimensionador (a=attention) pegava o centro e cortava rostos. */
function sized(src,w){if(!IMG_RESIZER||!src||/picsum\.photos/.test(src))return src;
return IMG_RESIZER+encodeURIComponent(src)+'&w='+w+'&output=webp&q=72';}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let proxyPref=Math.min(PROXIES.length-1,Math.max(0,parseInt(store.get(PREF_KEY)||'0',10)||0));

async function fetchText(url,ms){
const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
try{const res=await fetch(url,{signal:ctl.signal,cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);return await res.text();}
finally{clearTimeout(t);}}
async function getFeed(url){
const order=[proxyPref,...PROXIES.map((_,i)=>i).filter(i=>i!==proxyPref)];
let lastErr;
for(const i of order){
try{const txt=await fetchText(PROXIES[i](url),i===0?6000:10000);
if(!/<rss[\s>]/i.test(txt))throw new Error('Resposta não é RSS');
if(i!==proxyPref){proxyPref=i;store.set(PREF_KEY,String(i));}
return txt;}catch(e){lastErr=e;}}
throw lastErr||new Error('Falha ao carregar '+url);}
/* ================= Faixa local: Novo Hamburgo/RS =================
   data/novo-hamburgo.json é gerado por uma coleta diária (manchetes + resumo próprio + link da fonte).
   Mesma origem do app: sem CORS e sem proxy. */
const NH_URL='data/novo-hamburgo.json',NH_TITLE='Novo Hamburgo';
const escHtml=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadNH(){
try{const d=JSON.parse(await fetchText(NH_URL+'?t='+Math.floor(Date.now()/600000),8000));
const items=(d.items||[]).map((it,i)=>{const t=Date.parse(it.date);
return{id:'nh-'+(it.link||i),title:it.title,link:it.link,img:/^https?:\/\//.test(it.img||'')?it.img:'',date:isNaN(t)?null:t,
author:'',src:it.source||'',cat:it.cat||'Novo Hamburgo',
html:(Array.isArray(it.body)&&it.body.length?it.body:[it.summary]).map(p=>'<p>'+escHtml(p)+'</p>').join('')
+(it.source?'<p><em>Com informações de '+escHtml(it.source)+'.</em></p>':'')};})
.filter(it=>it.title&&it.link).slice(0,MAX_PER_RAIL);
return items.length?{title:NH_TITLE,items}:null;}
catch(e){console.warn('[Read on TV] faixa Novo Hamburgo indisponível:',e);return null;}}

function parseFeed(xml){
const doc=new DOMParser().parseFromString(xml,'text/xml');
if(doc.getElementsByTagName('parsererror').length)throw new Error('XML inválido');
return [...doc.getElementsByTagName('item')].map(n=>{
const txt=tag=>{const e=n.getElementsByTagName(tag)[0];return e?e.textContent.trim():'';};
const cr=n.getElementsByTagNameNS(DC,'creator')[0]||n.getElementsByTagName('dc:creator')[0];
const cat=n.getElementsByTagName('category')[0];
const guid=txt('guid'),link=txt('link'),d=Date.parse(txt('pubDate'));
const img=txt('imagem-destaque');
return{id:(guid.match(/^\d+/)||[guid||link])[0],title:txt('title'),link,img:/^https?:\/\//.test(img)?img:'',
date:isNaN(d)?null:d,author:cr?cr.textContent.trim():'',cat:cat?cat.textContent.trim():'Notícias',html:txt('description')};
}).filter(it=>it.title&&it.link);}

/* ================= Limpeza do HTML da matéria ================= */
const KEEP=new Set(['P','H2','H3','H4','STRONG','B','EM','I','UL','OL','LI','BLOCKQUOTE','FIGURE','FIGCAPTION','IMG','BR']);
const INLINE=new Set(['#text','STRONG','B','EM','I','BR']);
function cleanHtml(raw){
const doc=new DOMParser().parseFromString('<div id="x">'+raw+'</div>','text/html'),root=doc.getElementById('x');
root.querySelectorAll('script,style,noscript,iframe,object,embed,form,video,audio,svg').forEach(n=>n.remove());
// imagens: pixel de rastreio e logo fora; lazy-load (data-echo) vira src
root.querySelectorAll('img').forEach(im=>{const s=im.getAttribute('data-echo')||im.getAttribute('src')||'';

/* ================= Sons da interface (Web Audio API) ================= */
/* Três sons, um único conjunto de notas: Lá3 (220 Hz) e Mi4 (330 Hz).
   Secos (sem ambiência), graves (passa-baixa ~900 Hz) e curtos (≤0,2 s):
   - navegar: Lá3 isolado, um toque breve;
   - entrar: Lá3 → Mi4, subindo;
   - voltar: Mi4 → Lá3, descendo.
   localStorage 'readontv:sfx' = 'off' desliga os sons. */
const SFX_ON=store.get('readontv:sfx')!=='off',SFX_VOLUME=.3; // volume geral (0–1)
const NOTE={lo:220,hi:330};
const sfx=(()=>{
const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,out=null,lastNav=0;
function init(){if(!AC||!SFX_ON)return null;
if(!ctx){try{ctx=new AC();out=ctx.createGain();out.gain.value=SFX_VOLUME;
const comp=ctx.createDynamicsCompressor?ctx.createDynamicsCompressor():null;
if(comp){comp.threshold.value=-18;comp.ratio.value=4;out.connect(comp);comp.connect(ctx.destination);}else out.connect(ctx.destination);
}catch(e){ctx=null;return null;}}
if(ctx.state==='suspended'&&ctx.resume)ctx.resume().catch(()=>{});
return ctx;}
// uma nota seca: senoide → envelope curto → passa-baixa → saída
function note(f,at,dur,vol){const c=init();if(!c)return;const t=c.currentTime+at;
const osc=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
osc.type='sine';osc.frequency.setValueAtTime(f,t);
lp.type='lowpass';lp.frequency.value=900;lp.Q.value=.5;
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
osc.connect(g);g.connect(lp);lp.connect(out);
osc.onended=()=>[osc,g,lp].forEach(n=>{try{n.disconnect();}catch(e){}});
osc.start(t);osc.stop(t+dur+.02);}
return{
unlock:init,
nav(repeat){const now=performance.now();if(now-lastNav<50)return;lastNav=now;note(NOTE.lo,0,.06,repeat?.3:.45);},
enter(){note(NOTE.lo,0,.09,.45);note(NOTE.hi,.07,.12,.4);},
back(){note(NOTE.hi,0,.09,.4);note(NOTE.lo,.07,.12,.45);}};})();
// só toca quando o foco realmente muda (silêncio nas bordas)
function cue(moved,e){if(moved)sfx.nav(e.repeat);}
// política de autoplay: o contexto só pode iniciar após um gesto do usuário (tecla, clique, toque)
['keydown','pointerdown','touchstart'].forEach(ev=>addEventListener(ev,()=>sfx.unlock(),{capture:true,passive:true}));

/* ================= Gamepad API (Xbox, PlayStation, genéricos) ================= */
// Usa o mesmo onKey do controle remoto: o controle vira setas, OK e Voltar.
// Layout "standard" (W3C): 0=A/✕ 1=B/○ 4=LB 5=RB 6=LT 7=RT 8=Back/Select 12–15=direcional
const GP_BTN={0:'Enter',1:'Escape',8:'Escape',4:'PageUp',5:'PageDown',6:'PageUp',7:'PageDown',12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight'};
const GP_REPEAT=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown'];
const GP_DEAD=.5,GP_DELAY=400,GP_RATE=130; // zona morta do analógico; atraso e ritmo da repetição ao segurar
const gpHeld={};let gpRaf=0;
function gpSend(key,repeat){onKey({key,keyCode:0,repeat,preventDefault(){}});}
function gpKeys(gp){const on=new Set(),std=gp.mapping==='standard';
gp.buttons.forEach((b,i)=>{if(!b||!(b.pressed||b.value>.5))return;
// layout desconhecido: só A/B são previsíveis; a navegação vem do analógico
const k=std?GP_BTN[i]:(i===0?'Enter':i===1?'Escape':null);if(k)on.add(k);});
const x=gp.axes[0]||0,y=gp.axes[1]||0;
if(Math.abs(x)>GP_DEAD||Math.abs(y)>GP_DEAD){if(Math.abs(x)>Math.abs(y))on.add(x>0?'ArrowRight':'ArrowLeft');else on.add(y>0?'ArrowDown':'ArrowUp');}
return on;}
function gpLoop(t){gpRaf=0;let pads=[];
try{pads=Array.prototype.filter.call(navigator.getGamepads?navigator.getGamepads():[],Boolean);}catch(e){}
if(!pads.length){for(const k in gpHeld)delete gpHeld[k];return;} // sem controle: o loop para até o próximo gamepadconnected
const on=new Set();pads.forEach(gp=>gpKeys(gp).forEach(k=>on.add(k)));
for(const k in gpHeld)if(!on.has(k))delete gpHeld[k];
on.forEach(k=>{const h=gpHeld[k];
if(!h){gpHeld[k]={next:t+GP_DELAY};gpSend(k,false);}
else if(GP_REPEAT.indexOf(k)>=0&&t>=h.next){h.next=t+GP_RATE;gpSend(k,true);}});
gpRaf=requestAnimationFrame(gpLoop);}
function gpStart(){if(!gpRaf)gpRaf=requestAnimationFrame(gpLoop);}

function rmRender(){const url=rmPhoneUrl();$('rmCode').textContent=rm.code;$('rmUrl').textContent=url.replace(/^https?:\/\//,'').replace(/\?.*$/,'');
const box=$('rmQr');if(typeof qrcode==='undefined'){box.textContent='';return;}
try{const q=qrcode(0,'M');q.addData(url);q.make();box.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){box.textContent='';}}
function rmLoadLibs(done){let i=0;(function next(){if(i>=RM_LIBS.length){done(true);return;}
const s=document.createElement('script');s.src=RM_LIBS[i++];s.onload=next;s.onerror=()=>done(false);document.head.appendChild(s);})();}
function rmStart(){if(rm.clients.length||rm.starting)return;rm.starting=true;rmStatus('Conectando…',false);
rmLoadLibs(ok=>{rm.starting=false;if(!ok||typeof mqtt==='undefined'){rmStatus('Não foi possível carregar o controle. Verifique a internet.',false);return;}rmRender();rmConnect();});}
function rmConnect(){rm.clients=[];rm.live=[];
RM_BROKERS.forEach((url,i)=>{const c=mqtt.connect(url,{clientId:'rotv-on-tv-'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:10000,reconnectPeriod:3000,keepalive:30,timerVariant:'native'});
rm.clients[i]=c;rm.live[i]=false;
c.on('connect',()=>{const first=!rmLive();rm.live[i]=true;c.subscribe(RM_PREFIX+rm.code+'/cmd',{qos:0});
if(first){rm.bi=i;rmRender();}rmStatus(rmReady(),rm.paired);});
c.on('close',()=>{rm.live[i]=false;if(!rmLive())rmStatus('Reconectando…',false);});
c.on('offline',()=>{if(!rmLive())rmStatus('Sem conexão com a internet',false);});
c.on('error',()=>{}); // o mqtt.js segue tentando; o outro broker cobre enquanto isso
c.on('message',(topic,payload)=>{let m;try{m=JSON.parse(String(payload));}catch(e){return;}
if(!m||!RM_KEYS[m.k]||topic!==RM_PREFIX+rm.code+'/cmd')return;
// mesmo comando chegando por dois caminhos (reconexão, dois brokers): executa uma vez só
const now=Date.now();if(m.n===rmSeen.n&&now-rmSeen.t<1500)return;rmSeen={n:m.n,t:now};
// confirmação pelo mesmo broker que trouxe o comando
c.publish(RM_PREFIX+rm.code+'/ack',JSON.stringify({n:m.n}),{qos:0});
remoteCommand(m.k);});});}
/* Revoga o código: avisa o celular pareado, troca o código e passa a escutar só o novo */
function rmRevoke(){const old=rm.code;rm.code=rmNewCode(old);rm.paired=false;rmToasted=false;
try{localStorage.removeItem(RM_KEY_PAIRED);}catch(e){}
rm.clients.forEach((c,i)=>{if(!rm.live[i])return;c.publish(RM_PREFIX+old+'/ack',JSON.stringify({revoked:true}),{qos:0});
c.unsubscribe(RM_PREFIX+old+'/cmd');c.subscribe(RM_PREFIX+rm.code+'/cmd',{qos:0});});
rmRender();rmSync();if(!rm.clients.length)rmStart();else rmStatus(rmLive()?'Novo código pronto. Aguardando o celular…':'Conectando…',false);}
function remoteCommand(k){
if(!rm.paired){rm.paired=true;store.set(RM_KEY_PAIRED,'1');rmSync();}
rmStatus('Celular conectado',true);
if(!rmToasted&&!rmIsOpen){rmToasted=true;showToast('Controle do celular conectado',2200);}
// o primeiro comando com a tela de pareamento aberta só a fecha
if(rmIsOpen){rmClose();return;}
remoteKey(k);}
/* Converte o comando numa tecla e passa pelo mesmo onKey do controle remoto (setas, OK, Voltar, páginas) */
function remoteKey(k){const d=RM_KEYS[k],now=performance.now();
// celular segurando a seta manda comandos a cada ~160 ms: trata como tecla repetida (som mais baixo)
const rep=k===rmLast.k&&now-rmLast.t<260&&/^(up|down|left|right|pgup|pgdn)$/.test(k);rmLast={k,t:now};
onKey({key:d[0],keyCode:d[1],repeat:rep,ctrlKey:false,metaKey:false,altKey:false,preventDefault(){}});}
function rmFocus(){rmBtns.forEach((b,i)=>b.classList.toggle('on',i===rf));focusEl(rmBtns[rf]);}
function rmMove(i){if(i===rf)return false;rf=i;rmFocus();return true;}
function rmAct(i){if(i===0)rmClose();else{sfx.enter();rmRevoke();}}
function rmOpen(){if(rmIsOpen)return;rmIsOpen=true;inSide=false;render();rf=0;rmEl.classList.add('show');rmEl.setAttribute('aria-hidden','false');setBgInert(true);
rmRender();if(rm.clients.length)rmStatus(rmLive()?rmReady():'Conectando…',rmLive()&&rm.paired);rmStart();rmFocus();}
function rmClose(){if(!rmIsOpen)return;rmIsOpen=false;sfx.back();rmEl.classList.remove('show');rmEl.setAttribute('aria-hidden','true');setBgInert(false);render();}
rmBtns.forEach((b,i)=>{b.addEventListener('click',()=>{rf=i;rmFocus();rmAct(i);});b.addEventListener('mouseenter',()=>rmMove(i));});
rmSync();
// já pareado antes: reconecta em segundo plano depois que a página carregar
if(rm.paired)addEventListener('load',()=>setTimeout(rmStart,1500));

/* ================= Abertura: despacho de agência (Web Audio API + WAAPI) ================= */
/* Roda em toda entrada (F5), com a linguagem do próprio app: fundo #2A2A2A, blocos retos, azul da marca, amarelo do foco.
   1. Fio azul de "agência" se estende e o teletipo data a edição (cidade · data · hora), tecla a tecla, com sininho de fim de linha.
   2. Três faixas de manchetes (do cache ou do feed; exemplos se não houver) entram como papel saindo da rotativa.
   3. A placa preta da manchete (a mesma da tela da matéria) bate e o logo é carimbado, com barra branca, batida seca e
      três toques de sino, o aviso de boletim urgente dos teletipos.
   4. O logo voa até o cabeçalho enquanto a Home aparece.
   Trilha 100% sintetizada; notas Lá3/Mi4 iguais aos sons de navegação. Áudio agendado no relógio do AudioContext;
   imagem com o mesmo atraso + latência de saída.
   Autoplay bloqueado → "Pressione OK"; qualquer tecla/clique pula. Desligar: ?intro=0 ou localStorage 'readontv:intro'='off'.
   Com 'readontv:sfx'='off' roda sem som. */
const INTRO=(()=>{
const ON=store.get('readontv:intro')!=='off'&&!/[?&]intro=0(&|$)/.test(location.search);
const el=$('intro'),bg=el.querySelector('.intro-bg'),wire=$('introWire'),wireTxt=$('introWireTxt'),rule=$('introRule'),rowsEl=$('introRows'),
plate=$('introPlate'),bar=$('introBar'),logo=$('introLogo'),tag=$('introTag'),gate=$('introGate');
const hdLogo=document.querySelector('.top .hd-logo');
const AC=window.AudioContext||window.webkitAudioContext,RM=reduced.matches;if(RM)el.classList.add('rm');
let state=ON?'boot':'off',ctx=null,master=null,bus=null,nbuf=null,snd=false,t0=0,held=null,T=null,DL='',timers=[],moves=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const kf=RM?f=>f.map((x,i)=>{const o={opacity:x.opacity==null?(i?1:0):x.opacity};if(x.offset!=null)o.offset=x.offset;return o;}):f=>f;
function anim(n,frames,delay,dur,ease,fill){return n.animate(kf(frames),{delay,duration:dur,easing:ease||'cubic-bezier(.2,.7,.2,1)',fill:fill||'both'});}

/* ---------- Roteiro (segundos): calculado a partir do tamanho da linha datada ---------- */
function script(){
const now=new Date();
const d=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:TZ}).replace(/\//g,'.');
const h=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}).replace(':','H');
DL=CITY.name.toUpperCase()+' · '+d+' · '+h;
const type=.3,cps=.026,end=type+DL.length*cps,rows=[0,1,2].map(i=>end+.14+i*.12),stamp=rows[2]+.5;
// HOLD: quanto tempo a capa montada fica na tela antes de ir para a Home
const HOLD=2.6;
T={type,cps,ding:end+.04,rows,stamp,fly:stamp+HOLD};}

/* ---------- Síntese ---------- */
function audio(){
if(!AC)return null;
try{ctx=new AC({latencyHint:'interactive'});}catch(e){ctx=null;return null;}
const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.003;comp.release.value=.2;
master=ctx.createGain();master.gain.value=.85;bus=ctx.createGain();
// sala pequena (redação), não um estúdio de cinema: reverberação curta e discreta
const rv=ctx.createConvolver(),wet=ctx.createGain();rv.buffer=impulse(1.3,3.5);wet.gain.value=.14;
bus.connect(master);bus.connect(rv);rv.connect(wet);wet.connect(master);master.connect(comp);comp.connect(ctx.destination);
nbuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const n=nbuf.getChannelData(0);for(let i=0;i<n.length;i++)n[i]=Math.random()*2-1;
return ctx;}
function impulse(sec,decay){const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function env(p,t,a,v,d){p.setValueAtTime(.0001,t);p.exponentialRampToValueAtTime(v,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);}
function gain(dest){const g=ctx.createGain();g.gain.value=0;g.connect(dest);return g;}
function lowpass(f,dest){const l=ctx.createBiquadFilter();l.type='lowpass';l.frequency.value=f;l.Q.value=.7;l.connect(dest);return l;}
function osc(type,f,t,end,dest){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(end);
o.onended=()=>{try{o.disconnect();}catch(e){}};return o;}
function noise(t,dur,o){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=gain(o.dry?master:bus),a=o.a||dur*.3;
s.buffer=nbuf;s.loop=true;f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f0,t);
if(o.fm)f.frequency.exponentialRampToValueAtTime(o.fm,t+dur*.5);f.frequency.exponentialRampToValueAtTime(o.f1||o.f0,t+dur);
env(g.gain,t,a,o.v,Math.max(.01,dur-a));s.connect(f);f.connect(g);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
// fio se estendendo: papel deslizando
function slide(t,d){noise(t,d,{f0:700,f1:3200,q:.9,v:.05,a:d*.7});}
// tecla do teletipo: estalo metálico + corpo grave da martelada
function strike(t,v){noise(t,.028,{f0:2400+Math.random()*1200,q:1.4,v,a:.002,dry:1});
const g=gain(lowpass(700,master));env(g.gain,t,.002,v*.7,.05);osc('square',120+Math.random()*30,t,t+.08,g);}
// sino com parciais inarmônicas (campainha de teletipo)
function bell(f,t,v,dec){[[1,1],[2,.5],[2.74,.32],[4.07,.2],[5.4,.1]].forEach(([r,a],k)=>{const g=gain(bus);env(g.gain,t,.002,v*a,dec/(1+k*.6));osc('sine',f*r,t,t+dec+.1,g);});}
// faixa saindo da rotativa: "chec" mecânico + nota (Lá3, Mi4, Lá3) + papel passando
function sheet(t,f){noise(t,.07,{type:'lowpass',f0:1100,v:.16,a:.003,dry:1});
const g=gain(lowpass(1800,bus));env(g.gain,t,.004,.22,.22);osc('triangle',f,t,t+.3,g);
noise(t+.02,.5,{f0:900,fm:2000,f1:600,q:.8,v:.035,a:.2});}
function thump(t){const g=gain(master);env(g.gain,t,.005,.85,.4);const o=osc('sine',120,t,t+.5,g);o.frequency.exponentialRampToValueAtTime(45,t+.2);}
// carimbo: batida + acorde seco Lá2/Mi3/Lá3 + três toques de sino (boletim urgente)
function stampSfx(t){thump(t);const lp=lowpass(900,master);
[110,164.81,220].forEach(f=>{const g=gain(lp);env(g.gain,t,.004,.09,.3);osc('square',f,t,t+.4,g);});
[0,.13,.26].forEach((d,i)=>bell(880,t+.1+d,i===2?.2:.15,1.4));}
function swish(t,d){noise(t,d,{f0:2400,f1:380,q:.9,v:.09,a:d*.4});}
function score(b){slide(b,.32);
[...DL].forEach((c,i)=>{if(c!==' ')strike(b+T.type+i*T.cps,.07+Math.random()*.03);});
bell(1318.51,b+T.ding,.1,1);
T.rows.forEach((t,i)=>sheet(b+t,[220,329.63,220][i]));
stampSfx(b+T.stamp);swish(b+T.fly-.05,.6);
master.gain.setValueAtTime(.85,b+T.fly+.5);master.gain.setTargetAtTime(.0001,b+T.fly+.5,.3);}
function closeAudio(){if(ctx){const c=ctx;ctx=null;try{c.close();}catch(e){}}}

/* ---------- Imagem ---------- */
function headlines(){let list=[];
RAILS.forEach(R=>R.items.forEach(it=>{if(!it.sk&&it.title)list.push(it);}));
if(list.length<6)DEMO.forEach(R=>R.items.forEach(it=>list.push(it)));
const seen=new Set();list=list.filter(it=>!seen.has(it.title)&&seen.add(it.title)).slice(0,15);
return [0,1,2].map(i=>list.filter((_,k)=>k%3===i));}
function buildRows(){rowsEl.textContent='';
return headlines().map((items,i)=>{const r=document.createElement('div');r.className='ir';r.style.top=[340,540,800][i]+'px';
for(let rep=0;rep<4;rep++)items.forEach(it=>{const c=document.createElement('span');c.className='c';c.textContent=it.cat;
const t=document.createElement('span');t.textContent=it.title;const q=document.createElement('i');q.className='q';r.append(c,t,q);});
rowsEl.appendChild(r);return r;});}
function typeOn(lead){// teletipo: um caractere por vez, no mesmo tempo das teclas
[...DL].forEach((c,i)=>later(()=>{if(c==='·'){const b=document.createElement('b');b.textContent=c;wireTxt.appendChild(b);}else wireTxt.append(c);},(lead+T.type+i*T.cps)*1000));}
function visuals(lead){const ms=s=>lead*1000+s*1000;
anim(rule,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],ms(0),340,'cubic-bezier(.6,0,.2,1)');
anim(wire,[{opacity:0},{opacity:1}],ms(.18),160,'linear');
typeOn(lead);
buildRows().forEach((r,i)=>{const left=i!==1;
anim(r,[{opacity:0,clipPath:left?'inset(0 0 0 100%)':'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],ms(T.rows[i]),320,'cubic-bezier(.6,0,.2,1)');
if(!RM)moves.push(r.animate([{transform:'translateX('+(left?0:-1500)+'px)'},{transform:'translateX('+(left?-1100:-400)+'px)'}],{delay:ms(T.rows[i]),duration:9000,easing:'linear',fill:'both'}));});
// carimbo
anim(plate,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],ms(T.stamp-.09),170,'cubic-bezier(.7,0,.3,1)');
anim(logo,[{opacity:0,transform:'scale(1.09)'},{opacity:1,transform:'scale(.985)',offset:.7},{opacity:1,transform:'scale(1)'}],ms(T.stamp),200,'cubic-bezier(.3,0,.2,1)');
anim(bar,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],ms(T.stamp+.1),340,'cubic-bezier(.6,0,.2,1)');
anim(tag,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms(T.stamp+.36),380);
// com a manchete batida, as faixas desaceleram e recuam
anim(rowsEl,[{opacity:1},{opacity:.4}],ms(T.stamp),420,'ease','forwards');
anim(wire,[{opacity:1},{opacity:.5}],ms(T.stamp),420,'ease','forwards');
later(()=>moves.forEach(m=>{try{m.updatePlaybackRate(.25);}catch(e){}}),ms(T.stamp));}

/* ---------- Fluxo ---------- */
function play(withSound){state='playing';snd=withSound;script();el.classList.add('run');
const lead=.12,lat=snd?(ctx.outputLatency||ctx.baseLatency||0):0;
if(snd)score(ctx.currentTime+lead);
visuals(lead+lat);t0=performance.now()+(lead+lat)*1000;
later(()=>fly(false),(lead+lat+T.fly)*1000);}
// o logo voa até o lugar exato do logo do cabeçalho (FLIP pelo centro) enquanto a Home aparece
function fly(fast){if(state!=='playing')return;state='flying';
timers.forEach(clearTimeout);timers=[];wireTxt.textContent='';[...DL].forEach(c=>{if(c==='·'){const b=document.createElement('b');b.textContent=c;wireTxt.appendChild(b);}else wireTxt.append(c);});
el.getAnimations({subtree:true}).forEach(a=>{if(moves.indexOf(a)<0)try{a.finish();}catch(e){}});
const dur=RM?400:fast?420:760;
if(RM)anim(logo,[{opacity:1},{opacity:0}],0,dur,'ease','forwards');
else{const a=logo.getBoundingClientRect(),b=hdLogo.getBoundingClientRect(),sc=stage.getBoundingClientRect().width/1920;
const dx=(b.left+b.width/2-a.left-a.width/2)/sc,dy=(b.top+b.height/2-a.top-a.height/2)/sc;
logo.animate([{transform:'none'},{transform:'translate('+dx+'px,'+dy+'px) scale('+(b.width/a.width)+')'}],{duration:dur,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});}
[plate,bar,tag,wire,rule,rowsEl].forEach(n=>anim(n,[{opacity:getComputedStyle(n).opacity},{opacity:0}],0,dur*.45,'ease','forwards'));
anim(bg,[{opacity:1},{opacity:0}],dur*.25,dur*.75,'ease','forwards');
const D=dur*.3;
[[document.querySelector('.hd-bar'),0],...[...document.querySelectorAll('.hd-info>:not(.hd-logo)')].map(n=>[n,70]),[railsEl,150]]
.forEach(([n,d])=>anim(n,[{opacity:0,translate:'0 36px'},{opacity:1,translate:'0 0'}],D+d,dur*.8,undefined,'backwards'));
if(snd&&ctx&&fast){const now=ctx.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.setTargetAtTime(.0001,now,.07);}
setTimeout(()=>finish(fast),dur+40);}
function finish(fast){state='done';stage.classList.remove('intro-on');el.remove();moves=[];
setTimeout(closeAudio,fast?700:2000);
render();
if(held){const h=held;held=null;setTimeout(()=>showToast(h[0],h[1]),250);}}
async function start(){if(state!=='gate')return;state='starting';
const resumed=ctx&&ctx.state!=='running'?ctx.resume():null; // ainda dentro do gesto do usuário
anim(gate,[{opacity:1},{opacity:0}],0,220,'ease','forwards');
if(resumed){try{await Promise.race([resumed,wait(400)]);}catch(e){}}
gate.hidden=true;play(!!ctx&&ctx.state==='running');}
function skip(){if(state==='playing'&&performance.now()-t0>250)fly(true);}
async function boot(){
if(!ON){stage.classList.remove('intro-on');el.remove();return;}
await Promise.race([document.fonts.ready,wait(1200)]);
if(SFX_ON)audio();
if(ctx&&ctx.state!=='running'){try{await Promise.race([ctx.resume(),wait(300)]);}catch(e){}}
if(ctx&&ctx.state!=='running'){state='gate';gate.hidden=false;return;}
play(!!ctx);}
// teclas e cliques pertencem à abertura enquanto ela está na tela (F5 e atalhos do navegador seguem funcionando)
function key(e){if(state==='off'||state==='done')return false;
if(/^F\d{1,2}$/.test(e.key||'')||e.ctrlKey||e.metaKey||e.altKey)return true;
if(e.preventDefault)e.preventDefault();if(e.repeat)return true;
if(state==='gate')start();else skip();return true;}
el.addEventListener('pointerdown',()=>{if(state==='gate')start();else skip();});
return{key,boot,hold(m,ms){if(state==='off'||state==='done')return false;held=[m,ms];return true;}};})();
INTRO.boot();

/* ================= Carregamento ================= */
function setLive(ok,msg){liveIcon.classList.toggle('off',!ok);liveIcon.title=msg;}
function saveCache(data){const slim=data.map(R=>({title:R.title,big:!!R.big,items:R.items}));
if(!store.set(CACHE_KEY,JSON.stringify({t:Date.now(),rails:slim}))){
// sem espaço: guarda só os trilhos principais
store.set(CACHE_KEY,JSON.stringify({t:Date.now(),rails:slim.slice(0,2)}));}}
function readCache(){try{const c=JSON.parse(store.get(CACHE_KEY)||'null');if(c&&Array.isArray(c.rails)&&Date.now()-c.t<24*3600e3)return c;}catch(e){}return null;}
let loading=false;
async function loadAll(){
if(loading)return;loading=true;
const nhP=loadNH();
try{
const latest=parseFeed(await getFeed(FEED_BASE+'ultimasnoticias/feed.xml'));
if(!latest.length)throw new Error('Feed vazio');
const nh=await nhP;
const base=[{title:'Destaques',big:true,items:latest.slice(0,5)}];
if(nh)base.push(nh);
base.push({title:'Últimas notícias',items:latest.slice(5,5+MAX_PER_RAIL)});
const previous=source==='live'||source==='cache'?RAILS.filter(R=>R.title!=='Destaques'&&R.title!=='Últimas notícias'&&R.title!==NH_TITLE):[];
build(base.concat(previous));source='live';setLive(true,'Ao vivo: Agência Brasil');
const res=await Promise.allSettled(EDITORIAS.map(([slug])=>getFeed(FEED_BASE+slug+'/feed.xml').then(parseFeed)));
const eds=[];
EDITORIAS.forEach(([,title],i)=>{const v=res[i];
if(v.status==='fulfilled'&&v.value.length)eds.push({title,items:v.value.slice(0,MAX_PER_RAIL)});
else{const old=previous.find(R=>R.title===title);if(old)eds.push({title,items:old.items});}});
const full=base.concat(eds);build(full);saveCache(full);
setLive(true,'Ao vivo: Agência Brasil · atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
}catch(err){
console.warn('[Read on TV] feed indisponível:',err);
const nh=await nhP;
if(source==='skeleton'&&nh){build([nh]);source='nh';setLive(false,'Agência Brasil indisponível: só Novo Hamburgo');showToast('Não foi possível carregar a Agência Brasil. Exibindo Novo Hamburgo.',3200);}
else if(source==='skeleton'){build(DEMO);source='demo';setLive(false,'Sem conexão: notícias de exemplo');showToast('Não foi possível carregar a Agência Brasil. Exibindo exemplos.',3200);}
else{setLive(false,'Sem conexão: exibindo notícias salvas');if(source==='cache')showToast('Sem conexão. Exibindo as últimas notícias salvas.',3000);}
}finally{loading=false;}}

const cached=readCache();
if(cached){build(cached.rails);source='cache';setLive(false,'Notícias salvas · atualizando…');}
else build(SKELETON);
loadAll();
setInterval(loadAll,REFRESH_MS);
setInterval(updateAges,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateAges();const c=readCache();if(!c||Date.now()-c.t>REFRESH_MS)loadAll();}});
</script>
